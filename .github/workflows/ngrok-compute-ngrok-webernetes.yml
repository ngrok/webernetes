# ngrok ship manages this workflow. Ship opens a pull request whenever its
# template changes. To take over the file and stop those pull requests, add
# the line "# ngrok-ship: pipeline-updates disabled" anywhere in it.
# This app is deployed on ngrok Ship (https://ngrok.com/ship).

name: "ngrok ship (ngrok-webernetes)"

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    # A pull request from a fork gets no OIDC token, so Ship cannot serve
    # its build config. Skip the job instead of failing it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # On a pull request, this checks out GitHub's merge of the PR into its
      # base, so the preview runs what the merge will ship.
      - uses: actions/checkout@v6
      # To build this app only when it changes, add an `if:` to this step
      # or a `paths:` filter under `on:`. Ship deploys only the images that
      # this step reports, so a skipped build deploys nothing.
      - uses: ngrok/ship-action@v1
        with:
          app-id: "app_3GV2ZywoIIZABypPyS04L3KDrbJ"
