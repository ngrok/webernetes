name: "Build and Push Container (ngrok-webernetes / app_3GV2ZywoIIZABypPyS04L3KDrbJ)"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_REFERENCE: "registry.ship.ngrok.com/ac_1gbcp4ul5rptr9eqgwj21icgsux/app_3gv2zywoiizabyppys04l3kdrbj"
  NGROK_APP_ID: "app_3GV2ZywoIIZABypPyS04L3KDrbJ"

jobs:
  build-and-push:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6.1.0"

      - uses: "docker/login-action@v4.8.0"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3Fpsi82fNgKVILsGzy3HzE5JA28"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3FPSI82FNGKVILSGZY3HZE5JA28 }}"

      - id: "meta"
        uses: "docker/metadata-action@v6.2.0"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - uses: "docker/build-push-action@v7.4.0"
        with:
          context: "."
          file: "demo/Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: "Write image reference"
        run: |
          cat <<EOF > ngrok-image.json
          {"image":"${{ steps.meta.outputs.tags }}","commit_sha":"${{ github.sha }}"}
          EOF

      - uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "ngrok-compute-image"
          path: "ngrok-image.json"
